<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BE Addon Studio v0.4 Alpha</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <h1>BE Addon Studio</h1>

    <p class="subtitle">
        Modern Minecraft Bedrock Add-on Generator
    </p>

</header>

<main>

    <!-- ========================= -->
    <!-- Pack Information -->
    <!-- ========================= -->

    <section class="card">

        <h2>Pack Information</h2>

        <label>Pack Name</label>

        <input
            id="packName"
            type="text"
            placeholder="My Addon">

        <label>Description</label>

        <input
            id="packDescription"
            type="text"
            placeholder="Addon Description">

        <label>Version</label>

        <input
            id="packVersion"
            type="text"
            value="1.0.0">

        <label>Pack Icon</label>

        <label class="fileButton">

            Choose PNG

            <input
                id="packIcon"
                type="file"
                accept=".png">

        </label>

        <div id="packIconName">

            No icon selected

        </div>

    </section>

    <!-- ========================= -->
    <!-- Items -->
    <!-- ========================= -->

    <section class="card">

        <div class="titleRow">

            <h2>Items</h2>

            <button id="addItem">

                + Add Item

            </button>

        </div>

        <div id="itemList"></div>

    </section>

    <!-- ========================= -->
    <!-- Output -->
    <!-- ========================= -->

    <section class="card">

        <h2>Build</h2>

        <textarea
            id="output"
            readonly
            placeholder="Build log..."></textarea>

        <button id="buildButton">

            Create MCADDON

        </button>

    </section>

</main>

<footer>

    <h3>BE Addon Studio</h3>

    <p>

        Developed by Junseong Kim × ChatGPT

    </p>

    <small>

        v0.4 Alpha

    </small>

</footer>

<!-- JSZip -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- Scripts -->

<script src="js/items.js"></script>

<script src="js/ui.js"></script>

<script src="js/build.js"></script>

<script src="js/script.js"></script>

</body>

</html>
